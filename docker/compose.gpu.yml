# NVIDIA GPU override for compose.yml. Usage (from the repo root):
#   docker compose -f docker/compose.yml -f docker/compose.gpu.yml up --build
# Requires the NVIDIA driver and the NVIDIA Container Toolkit (Linux) or
# Docker Desktop with the WSL2 backend (Windows).
services:
  itksnap-dls:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # adpkd:  # add the same deploy block when the adpkd-net service is merged
