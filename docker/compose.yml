# ITK-SNAP DLS server with the ADPKD segmentation service.
#
# Usage (from the repo root):
#   CPU (any machine): docker compose -f docker/compose.yml up --build
#   NVIDIA GPU:        docker compose -f docker/compose.yml -f docker/compose.gpu.yml up --build
# ITK-SNAP then connects to <host>:8911. Tuning variables (ADPKD_RUN_SMALL,
# ITKSNAP_DLS_CPU_THREADS) can be set in the shell or in docker/.env.
#
# Checklist when merging the adpkd-net service below:
#   - service name `adpkd` listening on 9000 (or change ADPKD_URL)
#   - mounts the same `adpkd-data` volume at /data/adpkd; reads inputs/itksnap/<run>.nii.gz
#     and writes outputs/<job_id>/seg.nii.gz (absolute paths are exchanged between containers)
#   - serves GET /health, POST /jobs, GET /jobs/{id} with status "succeeded" / "failed"
#   - has a healthcheck, then enable `depends_on` on itksnap-dls
#   - GPU reservation goes into compose.gpu.yml; at most one job at a time (fit.sh uses a fixed /workspace/temp)

services:
  itksnap-dls:
    build:
      context: ..
      dockerfile: docker/plugin.Dockerfile
    ports:
      - "8911:8911"
    environment:
      ADPKD_URL: http://adpkd:9000
      ADPKD_SHARED_INPUT_DIR: /data/adpkd/inputs/itksnap
      ADPKD_SHARED_OUTPUT_DIR: /data/adpkd/outputs
      ADPKD_RUN_SMALL: ${ADPKD_RUN_SMALL:-false}
      ITKSNAP_DLS_CPU_THREADS: ${ITKSNAP_DLS_CPU_THREADS:-2}
    volumes:
      - ${DATA_DIR:-../data}:/data # must be mounted at the same path in the adpkd service
      - ${MODELS_DIR:-../models}/itksnap:/models # nnInteractive and SAM2 weights
    restart: unless-stopped
  # depends_on:
  #   adpkd:
  #     condition: service_healthy

  # adpkd: <merge the adpkd-net service here>

  adpkd:
    build:
      context: ../libs/woznicki-adpkd
    image: adpkd-net:latest
    command:
      [
        "python3", "-m", "uvicorn", "api_service:app",
        "--app-dir", "/workspace/source",
        "--host", "0.0.0.0", "--port", "9000",
      ]
    environment:
      DATA_ROOT: /data/adpkd
      SOURCE_DIR: /workspace/source
      RESULTS_FOLDER: /workspace/source/trained_models
    volumes:
      # Same volume nomiso mounts at /data: DATA_ROOT=/data/adpkd is just a
      # subdirectory of it, so a file the nomiso plugin copies under
      # /data/adpkd/inputs/... is immediately visible here too.
      - ${DATA_DIR:-../data}:/data
      - ${MODELS_DIR:-../models}/adpkd:/workspace/source/trained_models

    restart: unless-stopped
